    <script>
        // Datos de productos - Catálogo Floral Completo
// Los productos están en js/productos.js (lista única del sitio)


        // Generar código de producto a partir del id
        function isArtificialTulip(p) {
            return p.artificialTulips === true || /tulip[aá]n(es)?\s+etern/i.test(p.description || '');
        }

        function getProductCode(id) {
            return 'COD-' + String(id).padStart(3, '0');
        }

        // Normalizar texto (quitar tildes y minúsculas)
        function normalize(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }


        // ===== ORDEN DEL CATÁLOGO GENERAL =====
        // Cada fila: 1) económico  2) precio medio  3) el más costoso.
        // Los de menos de $60.000 y los de flores eternas/satín van al fondo del catálogo.
        const PRECIO_MINIMO_DESTACADO = 60000;

        function esFlorEterna(p) {
            const texto = (p.name || '') + ' ' + (p.description || '');
            return (p.categories || []).includes('rosas-eternas') ||
                /\bsat[ií]n\b/i.test(texto) ||
                /(rosas?|flores?|tulipan(es)?|tulipán|girasol(es)?|hortensias?|lirios?|osito)\s+(eternas?|eternos?)/i.test(texto);
        }

        function esParaElFondo(p) {
            return p.price < PRECIO_MINIMO_DESTACADO || esFlorEterna(p);
        }

        // Reparte un grupo para que no queden juntos muchos productos de la misma categoría
        function variarCategorias(group) {
            const order = ['rosas', 'bouquets', 'cajas', 'canastas', 'girasoles', 'gerberas', 'lirios', 'pompones', 'tulipanes', 'coreano', 'novia', 'chocolates', 'premium'];
            const groups = {};
            group.forEach(p => {
                const cat = order.find(c => p.categories.includes(c)) || 'otros';
                (groups[cat] = groups[cat] || []).push(p);
            });
            const positioned = [];
            Object.keys(groups).forEach((cat, catIdx) => {
                const g = groups[cat].sort((a, b) => a.price - b.price);
                g.forEach((p, i) => positioned.push({ p, pos: (i + 0.5) / g.length, catIdx }));
            });
            positioned.sort((a, b) => a.pos - b.pos || a.catIdx - b.catIdx);
            return positioned.map(x => x.p);
        }

        // Devuelve la lista ordenada: filas económico / medio / costoso, luego fúnebres, luego los del fondo
        function ordenarCatalogoGeneral(list, priorityTag) {
            const funebre = list.filter(p => p.categories.includes('funebre'));
            const resto = list.filter(p => !p.categories.includes('funebre'));
            const alFondo = resto.filter(esParaElFondo);
            const principales = resto.filter(p => !esParaElFondo(p)).sort((a, b) => a.price - b.price);

            const tercio = Math.ceil(principales.length / 3);
            const tramos = [
                principales.slice(0, tercio),            // económicos
                principales.slice(tercio, tercio * 2),   // precio medio
                principales.slice(tercio * 2)            // más costosos
            ].map(g => {
                if (!priorityTag) return variarCategorias(g);
                const prio = g.filter(p => p.categories.includes(priorityTag));
                const otros = g.filter(p => !p.categories.includes(priorityTag));
                return [...variarCategorias(prio), ...variarCategorias(otros)];
            });

            const filas = [];
            const maxLen = Math.max(...tramos.map(g => g.length), 0);
            for (let i = 0; i < maxLen; i++) {
                tramos.forEach(g => { if (i < g.length) filas.push(g[i]); });
            }

            const fondo = [...alFondo].sort((a, b) => b.price - a.price);
            return [...filas, ...funebre, ...fondo];
        }

        // Cuántos productos muestra el filtro "Últimos Añadidos"
        const ULTIMOS_ANADIDOS = 24;

        // Estado global de búsqueda y filtro
        let currentFilter = 'todos';
        let currentSearch = '';

        // Renderizar productos
        function renderProducts(filter, search) {
            if (filter !== undefined) currentFilter = filter;
            if (search !== undefined) currentSearch = search;

            const grid = document.getElementById('products-grid');
            const emptyState = document.getElementById('empty-state');
            const resultsCount = document.getElementById('results-count');

            // Excluir productos ocultos
            let filteredProducts = products.filter(p => !p.hidden && !p.categories.includes('dia-padres'));

            // Productos más recientes (id más alto = añadido más reciente), sin fúnebres
            const newestFirst = filteredProducts
                .filter(p => !p.categories.includes('funebre'))
                .sort((a, b) => b.id - a.id);

            // Aplicar filtro de categoría
            if (currentFilter === 'recientes') {
                filteredProducts = newestFirst.slice(0, ULTIMOS_ANADIDOS);
            } else if (currentFilter !== 'todos') {
                filteredProducts = filteredProducts.filter(product =>
                    product.categories.includes(currentFilter)
                );
            }

            // Aplicar búsqueda de texto
            if (currentSearch.trim() !== '') {
                const searchNorm = normalize(currentSearch.trim());
                const searchWords = searchNorm.split(/\s+/);
                filteredProducts = filteredProducts.filter(product => {
                    const code = getProductCode(product.id);
                    const text = normalize(product.name + ' ' + product.description + ' ' + (product.gift || '') + ' ' + product.categories.join(' ') + ' ' + code);
                    return searchWords.every(word => text.includes(word));
                });
            }

            if (filteredProducts.length === 0) {
                grid.style.display = 'none';
                emptyState.classList.add('active');
                resultsCount.textContent = '0';
                return;
            }

            grid.style.display = 'grid';
            emptyState.classList.remove('active');
            resultsCount.textContent = filteredProducts.length;

            // Vista general del catálogo (sin filtro ni búsqueda)
            if (currentFilter === 'todos' && currentSearch.trim() === '') {
                // Primera fila: los últimos 3 productos añadidos (sin fúnebres, baratos ni eternos), de menor a mayor precio
                const primeraFila = newestFirst.filter(p => !esParaElFondo(p)).slice(0, 3).sort((a, b) => a.price - b.price);
                const primeraFilaIds = new Set(primeraFila.map(p => p.id));
                const resto = filteredProducts.filter(p => !primeraFilaIds.has(p.id));
                filteredProducts = [...primeraFila, ...ordenarCatalogoGeneral(resto)];
            }

            grid.innerHTML = filteredProducts.map(product => {
                const code = getProductCode(product.id);
                const imageList = product.images && product.images.length ? product.images : [product.image];
                const firstImage = imageList[0];
                const hasCarousel = imageList.length > 1;
                const carouselId = `carousel-${product.id}`;
                const slidesHtml = imageList.map((img, idx) => `
                    <img src="${img}" alt="${product.name} - vista ${idx+1}" class="product-image carousel-slide${idx===0?' active':''}" loading="lazy" data-index="${idx}">
                `).join('');
                const dotsHtml = hasCarousel ? `
                    <div class="carousel-dots">
                        ${imageList.map((_, idx) => `<span class="carousel-dot${idx===0?' active':''}" data-index="${idx}" onclick="event.stopPropagation(); goToSlide('${carouselId}', ${idx})"></span>`).join('')}
                    </div>
                    <button class="carousel-arrow carousel-prev" onclick="event.stopPropagation(); prevSlide('${carouselId}')" aria-label="Anterior">&#8249;</button>
                    <button class="carousel-arrow carousel-next" onclick="event.stopPropagation(); nextSlide('${carouselId}')" aria-label="Siguiente">&#8250;</button>
                    <span class="carousel-badge">${imageList.length} variaciones</span>
                ` : '';
                return `
                <div class="product-card" data-categories="${product.categories.join(' ')}">
                    <div class="product-image-container${hasCarousel?' has-carousel':''}" id="${carouselId}" data-images='${JSON.stringify(imageList)}' onclick="openLightbox(this.querySelector('.carousel-slide.active').src, '${product.name.replace(/'/g, "&#39;")}', '${formatPrice(product.price)}')">
                        <span class="product-code-badge">${code}</span>
                        ${slidesHtml}
                        ${dotsHtml}
                        <div class="zoom-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                                <line x1="11" y1="8" x2="11" y2="14"/>
                                <line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </div>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-description">${product.description}</div>
                        ${isArtificialTulip(product) ? `<div class="product-notice product-notice-artificial"><span class="product-notice-icon">\u{1F337}</span><span><strong>Tulipanes artificiales:</strong> los tulipanes de este arreglo son eternos (artificiales), no son flores naturales.</span></div>` : ''}
                        ${product.categories.includes('funebre') ? `<div class="product-notice"><span class="product-notice-icon">\u{2139}\u{FE0F}</span>Este arreglo se elabora con la flor disponible del día, logrando un diseño lo más similar posible a la imagen.</div>` : `<div class="product-notice"><span class="product-notice-icon">\u{2139}\u{FE0F}</span>Las flores, colores y detalles decorativos pueden variar según la disponibilidad del día. Conservamos el estilo, el tamaño y el valor del arreglo.</div>`}
                        ${product.gift ? `<div class="product-gift"><span class="product-gift-icon">\u{1F381}</span>${product.gift}</div>` : ''}
                        <div class="product-footer">
                            <div>
                                <span class="price-label">Desde</span>
                                <div class="product-price">${formatPrice(product.price)}</div>
                            </div>
                            <a href="https://wa.me/573151100609?text=${encodeURIComponent('Hola, me interesa el producto: ' + code + ' - ' + product.name + ' - ' + formatPrice(product.price) + '\nFoto: https://floristeriaibague.dondeseria.com/' + firstImage.replace('../', ''))}"
                               class="btn-order"
                               target="_blank">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                                </svg>
                                Pedir Ahora
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // ========== CARRUSEL DE IMÁGENES ==========
        function goToSlide(carouselId, index) {
            const carousel = document.getElementById(carouselId);
            if (!carousel) return;
            const slides = carousel.querySelectorAll('.carousel-slide');
            const dots = carousel.querySelectorAll('.carousel-dot');
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            if (slides[index]) slides[index].classList.add('active');
            if (dots[index]) dots[index].classList.add('active');
        }
        function nextSlide(carouselId) {
            const carousel = document.getElementById(carouselId);
            if (!carousel) return;
            const slides = carousel.querySelectorAll('.carousel-slide');
            const current = carousel.querySelector('.carousel-slide.active');
            const idx = Array.from(slides).indexOf(current);
            goToSlide(carouselId, (idx + 1) % slides.length);
        }
        function prevSlide(carouselId) {
            const carousel = document.getElementById(carouselId);
            if (!carousel) return;
            const slides = carousel.querySelectorAll('.carousel-slide');
            const current = carousel.querySelector('.carousel-slide.active');
            const idx = Array.from(slides).indexOf(current);
            goToSlide(carouselId, (idx - 1 + slides.length) % slides.length);
        }
        // Auto-rotación cada 3.5s
        setInterval(() => {
            document.querySelectorAll('.product-image-container.has-carousel').forEach(c => {
                nextSlide(c.id);
            });
        }, 3500);

        // Formatear precio
        function formatPrice(price) {
            return '$' + price.toLocaleString('es-CO');
        }

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderProducts(this.dataset.filter);
                window.scrollTo({ top: 400, behavior: 'smooth' });
            });
        });

        // Búsqueda
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        let searchTimeout;

        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const val = this.value;
            searchClear.classList.toggle('visible', val.length > 0);
            searchTimeout = setTimeout(() => {
                renderProducts(undefined, val);
            }, 250);
        });

        searchClear.addEventListener('click', function() {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            renderProducts(undefined, '');
            searchInput.focus();
        });

        // Lightbox
        function openLightbox(image, name, price) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightbox-image');
            const lightboxTitle = document.getElementById('lightbox-title');
            const lightboxPrice = document.getElementById('lightbox-price');

            lightboxImage.src = image;
            lightboxImage.alt = name;
            lightboxTitle.textContent = name;
            lightboxPrice.textContent = price;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Scroll to top
        const scrollTop = document.getElementById('scroll-top');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 500) {
                scrollTop.classList.add('visible');
            } else {
                scrollTop.classList.remove('visible');
            }
        });

        scrollTop.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Animación de corazones al activar filtro Día de las Madres
        function spawnHearts() {
            let container = document.querySelector('.hearts-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'hearts-container';
                document.body.appendChild(container);
            }
            const hearts = ['♥', '❤', '♡', '❣'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
                heart.style.color = ['#e91e63', '#ec407a', '#f06292', '#ff4081', '#ff80ab'][Math.floor(Math.random() * 5)];
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }
        }

        // Soporte #dia-madre en URL
        // SEGURO: Auto-filtro por hash desactivado para que SIEMPRE muestre todos los productos al entrar
        function checkHash() {
            // Comportamiento original deshabilitado:
            // if (window.location.hash === '#dia-madre' || window.location.hash === '#dia-madres') {
            //     document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            //     const madresBtn = document.querySelector('.filter-btn-madres');
            //     if (madresBtn) {
            //         madresBtn.classList.add('active');
            //         renderProducts('dia-madres');
            //         spawnHearts();
            //         setTimeout(() => {
            //             window.scrollTo({ top: 400, behavior: 'smooth' });
            //         }, 300);

            // }
